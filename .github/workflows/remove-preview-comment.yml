name: Remove preview comment

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remove-preview-comment.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove preview paragraph and temporary CSS
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path("index.html")
          html = index.read_text(encoding="utf-8")
          paragraph = '                <p>This is the browser-rendered preview derived from the same structure and content used by <code>examples/showcase.lua</code>.</p>\n'
          if paragraph not in html:
              raise SystemExit("preview paragraph not found")
          index.write_text(html.replace(paragraph, "", 1), encoding="utf-8")

          styles = Path("styles.css")
          css = styles.read_text(encoding="utf-8")
          temporary = '''\n#preview .section-heading > p {\n    display: none;\n}\n\n#preview .section-heading {\n    grid-template-columns: 1fr;\n}\n'''
          if temporary not in css:
              raise SystemExit("temporary preview CSS not found")
          styles.write_text(css.replace(temporary, "\n", 1), encoding="utf-8")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css
          git commit -m "style: remove preview explanation"
          git push
