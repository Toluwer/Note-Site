name: Update site for 0.3.1

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-031.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update release and neutral-theme copy
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path('index.html')
          index = index_path.read_text()
          index = index.replace(
              '<div class="eyebrow"><span class="status-dot"></span> Current release · v0.2.3</div>',
              '<div class="eyebrow">Current release · v0.3.1</div>',
          )
          index = index.replace('Current release · v0.3.0', 'Current release · v0.3.1')
          index = index.replace('<div><strong>18</strong><span>UI components</span></div>', '<div><strong>22</strong><span>UI components</span></div>')
          index = index.replace('<div><strong>41</strong><span>bundled modules</span></div>', '<div><strong>Modular</strong><span>source architecture</span></div>')
          index = index.replace('selections, and accent state update together', 'selections and theme state update together')
          index_path.write_text(index)

          script_path = Path('script.js')
          script = script_path.read_text().replace('Current release · v0.3.0', 'Current release · v0.3.1')
          script_path.write_text(script)

          visible_copy = index.lower()
          if 'accent state' in visible_copy or 'accent color' in visible_copy:
              raise RuntimeError('stale accent customization copy remains in index.html')
          if 'status-dot' in index:
              raise RuntimeError('status-dot markup remains in index.html')
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/update-031.yml

      - name: Commit site update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "release: update site for Note 0.3.1"
          git push
